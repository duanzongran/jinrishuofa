name: 今日说法清单每日增量

on:
  schedule:
    # UTC 14:00 = 北京时间 22:00，每天一次
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      pages:
        description: '抓取前几页（每页100条）'
        required: false
        default: '2'

permissions:
  contents: write

concurrency:
  group: jrsf-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取并增量更新
        env:
          PAGES: ${{ github.event.inputs.pages || '2' }}
          DATA_FILE: jrsf_list.json
        run: python crawl.py

      - name: 提交变更
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- jrsf_list.json; then
            echo "没有新节目，无需提交"
            exit 0
          fi
          git add jrsf_list.json
          git commit -m "自动更新今日说法清单 $(date -u +%Y-%m-%d)"
          git push
